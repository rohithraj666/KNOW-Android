
name: Build KNOW APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract KNOW source
        run: |
          test -f KNOW-Android-Source.zip
          unzip -o KNOW-Android-Source.zip -d extracted
          test -f extracted/KNOW/app/build.gradle.kts

      - name: Build debug APK
        run: |
          cd extracted/KNOW
          gradle assembleDebug

      - name: Upload KNOW APK
        uses: actions/upload-artifact@v4
        with:
          name: KNOW-APK
          path: extracted/KNOW/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          
